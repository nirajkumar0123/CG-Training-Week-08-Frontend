<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
            text-align: center;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 90%;
            margin: 0 auto;
        }

        .cards img {
            width: 100%;
            max-width: 250px;
            height: auto;
            border: 3px solid #000;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        h1{
            margin-bottom: 20px;
            font-size: 28px;
            color: #120a0a;
        }
    </style>
</head>
<body>
    <h1>Photo Gallery</h1>
    <main class="cards">
        <img src="images/flower1.avif" alt="Beautiful Flower">
        <img src="images/flower2.avif" alt="Beautiful Flower">
        <img src="images/flower3.avif" alt="Beautiful Flower">
        <img src="images/flower4.avif" alt="Beautiful Flower">
        <img src="images/flower5.avif" alt="Beautiful Flower">
        <img src="images/flower6.avif" alt="Beautiful Flower">
        <img src="images/flower7.avif" alt="Beautiful Flower">
        <img src="images/flower8.avif" alt="Beautiful Flower">
        <img src="images/flower9.avif" alt="Beautiful Flower">
        <img src="images/flower10.avif" alt="Beautiful Flower">
    </main>
</body>
</html>
